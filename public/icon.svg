<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282834" />
      <stop offset="100%" stop-color="#1b1b24" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41a1cf" />
      <stop offset="100%" stop-color="#0081c0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow / Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#41a1cf" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="28" r="14" fill="#41a1cf" fill-opacity="0.15" filter="url(#softGlow)" />

  <!-- Shield Shape -->
  <path d="M32 14L45 19.5V28.5C45 37.2 39.4 45.1 32 48C24.6 45.1 19 37.2 19 28.5V19.5L32 14Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.25"
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Verification Checkmark -->
  <path d="M26.5 30.5L30.5 34.5L38 25.5" 
        stroke="#fefffc" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 4 Sub-layer inspection telemetry dots -->
  <circle cx="32" cy="18" r="1.5" fill="#41a1cf" />
  <circle cx="41" cy="24" r="1.5" fill="#059669" />
  <circle cx="23" cy="24" r="1.5" fill="#41a1cf" />
  <circle cx="32" cy="43" r="1.5" fill="#fefffc" opacity="0.8" />
</svg>
